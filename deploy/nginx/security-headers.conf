# Security headers, as one snippet.
#
# nginx's add_header does not inherit: the moment a location adds a header of
# its own, every header set at server level vanishes from that location's
# responses. So these live here and every location that adds anything
# includes them, which is the only way /assets/ and sw.js get them too.
#
# The policy is measured, not hoped. The app loads scripts and styles from
# its own origin plus one inline script — the theme resolver in index.html,
# pinned by hash so a change to it fails loudly here rather than flashing the
# wrong theme quietly. Styles need 'unsafe-inline' for React's style
# attributes (gym colours, the aurora). Images come from this origin, from
# object URLs (photo previews, exports), and from whatever sync server the
# account names — same origin in production, https anywhere else — which is
# also why connect-src allows https. Loopback over plain http is allowed too:
# browsers already treat localhost as trustworthy on an https page, so it
# costs production nothing, and it is what a developer's local sync server
# and the audit walks' throwaway one both are. Nothing is ever framed.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-6Z4MI6pV88CkRipXCgvpj37keelgfp7csYyQsVj6ZNY='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http://localhost:* http://127.0.0.1:*; font-src 'self' data:; connect-src 'self' https: wss: http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:*; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
