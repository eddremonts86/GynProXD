# enForma sync server for Coolify: point a service at this compose file.
# First boot: open /_/ on the service URL and create the superuser, then set
# the SMTP settings (Settings → Mail) so verification and password reset send.
services:
  pocketbase:
    build: .
    restart: unless-stopped
    # No host port on purpose: the platform proxy (Traefik) is the only door,
    # so the raw API is never exposed on a public interface.
    environment:
      # Phase 7 shared fetches + the push public key served by /api/enforma/capabilities.
      #
      # COACH_* is the vendor-neutral trio and wins where set; MINIMAX_* stays so
      # a server that has not been reconfigured keeps answering. COACH_MODEL is
      # the one that used to be impossible: the model name was baked into the
      # browser bundle at build time, so trying another one cost a deploy.
      COACH_API_KEY: ${COACH_API_KEY:-}
      COACH_BASE_URL: ${COACH_BASE_URL:-}
      COACH_MODEL: ${COACH_MODEL:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-}
      FATSECRET_CLIENT_ID: ${FATSECRET_CLIENT_ID:-}
      FATSECRET_CLIENT_SECRET: ${FATSECRET_CLIENT_SECRET:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      # Seeds the superuser on boot; the push service uses the same pair.
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:-}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:-}
      #
      # ── Everything below is here because a variable this block does not name
      # never reaches the process, however carefully it was set.
      #
      # Coolify's environment variables feed compose *interpolation*: they land
      # in a `.env` beside this file and substitute into `${...}`. A service
      # only receives what its own `environment:` lists, and there is no
      # `env_file:` here on purpose — the list is the documentation of what this
      # server can be configured to do.
      #
      # So a key set in Coolify and absent from this block reads as a key that
      # does not work: `/api/enforma/capabilities` keeps answering false, the
      # feature stays invisible, and the obvious suspicion is the key. Three
      # whole features shipped that way — events, all three calendars and
      # billing — because the hooks that read these were added without this
      # half. Adding a `$os.getenv` to a hook means adding a line here.
      #
      # What is on near a member. Absent key, absent strip, by design.
      TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY:-}
      TICKETMASTER_BASE_URL: ${TICKETMASTER_BASE_URL:-}
      #
      # The calendars. `CALENDAR_SECRET` must be exactly 32 characters and is
      # what seals every stored credential at rest: without it the routes
      # refuse to connect anybody rather than holding a live token in the clear.
      # `APP_BASE_URL` is where a consent screen sends the member back to.
      CALENDAR_SECRET: ${CALENDAR_SECRET:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      # Optional, and the whole of the push: the public HTTPS address of
      # /api/enforma/calendar/google/notify. Google pushes only to a domain
      # verified in its Cloud project, so unset is a supported state — the
      # member keeps "Read it again" and no channel is opened.
      GOOGLE_WATCH_ADDRESS: ${GOOGLE_WATCH_ADDRESS:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-}
      #
      # Vendor addresses, empty in production and pointed at fakes on loopback
      # by the walks. Empty is falsy in the hooks, which then use the real host.
      GOOGLE_AUTH_BASE_URL: ${GOOGLE_AUTH_BASE_URL:-}
      GOOGLE_TOKEN_BASE_URL: ${GOOGLE_TOKEN_BASE_URL:-}
      GOOGLE_API_BASE_URL: ${GOOGLE_API_BASE_URL:-}
      MICROSOFT_AUTH_BASE_URL: ${MICROSOFT_AUTH_BASE_URL:-}
      MICROSOFT_API_BASE_URL: ${MICROSOFT_API_BASE_URL:-}
      CALDAV_BASE_URL: ${CALDAV_BASE_URL:-}
      #
      # Billing. The webhook secret is what makes an unsigned body somebody
      # claiming a subscription rather than Stripe reporting one, so a server
      # with the key and not the secret is one that must not be trusted to
      # write a plan. `STRIPE_PORTAL_URL` is Stripe's own hosted portal, where
      # cancelling happens, because cancelling is legally theirs to get right.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PORTAL_URL: ${STRIPE_PORTAL_URL:-}
    volumes:
      - pb_data:/pb/pb_data
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8090/api/health']
      interval: 30s
      timeout: 5s
      retries: 3

  # Phase 6: watches the gym bus and delivers Web Push while the app is closed.
  push:
    build: ./push
    restart: unless-stopped
    # The list form on purpose. The mapping form with `condition:
    # service_healthy` is valid compose and docker accepts it, but Coolify's
    # compose parser does not: the deploy of 18d83ac died in loadComposeFile()
    # with "Failed to read Git source" after a successful clone. The push
    # service already retries until PocketBase answers, so start order is a
    # nicety here, and PocketBase's own healthcheck still gates its status.
    depends_on:
      - pocketbase
    environment:
      PB_URL: http://pocketbase:8090
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:-}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:sync@enforma.local}
    volumes:
      - push_state:/state

volumes:
  pb_data:
  push_state:
