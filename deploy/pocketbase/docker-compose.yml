# enForma sync server for Coolify: point a service at this compose file.
# First boot: open /_/ on the service URL and create the superuser, then set
# the SMTP settings (Settings → Mail) so verification and password reset send.
services:
  pocketbase:
    build: .
    restart: unless-stopped
    # No host port on purpose: the platform proxy (Traefik) is the only door,
    # so the raw API is never exposed on a public interface.
    environment:
      # Phase 7 shared fetches + the push public key served by /api/enforma/capabilities.
      #
      # COACH_* is the vendor-neutral trio and wins where set; MINIMAX_* stays so
      # a server that has not been reconfigured keeps answering. COACH_MODEL is
      # the one that used to be impossible: the model name was baked into the
      # browser bundle at build time, so trying another one cost a deploy.
      COACH_API_KEY: ${COACH_API_KEY:-}
      COACH_BASE_URL: ${COACH_BASE_URL:-}
      COACH_MODEL: ${COACH_MODEL:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-}
      FATSECRET_CLIENT_ID: ${FATSECRET_CLIENT_ID:-}
      FATSECRET_CLIENT_SECRET: ${FATSECRET_CLIENT_SECRET:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      # Seeds the superuser on boot; the push service uses the same pair.
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:-}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:-}
    volumes:
      - pb_data:/pb/pb_data
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8090/api/health']
      interval: 30s
      timeout: 5s
      retries: 3

  # Phase 6: watches the gym bus and delivers Web Push while the app is closed.
  push:
    build: ./push
    restart: unless-stopped
    # The list form on purpose. The mapping form with `condition:
    # service_healthy` is valid compose and docker accepts it, but Coolify's
    # compose parser does not: the deploy of 18d83ac died in loadComposeFile()
    # with "Failed to read Git source" after a successful clone. The push
    # service already retries until PocketBase answers, so start order is a
    # nicety here, and PocketBase's own healthcheck still gates its status.
    depends_on:
      - pocketbase
    environment:
      PB_URL: http://pocketbase:8090
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:-}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:sync@enforma.local}
    volumes:
      - push_state:/state

volumes:
  pb_data:
  push_state:
