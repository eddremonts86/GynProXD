# Tell Coolify that `main` moved, and wait to hear whether it worked.
#
# The trigger lives here, where it is versioned and reviewable, and it is the
# only one. It began as a necessity: Coolify's "public repository" source
# installs no webhook and never deploys on its own, and five merges once sat
# undeployed for two hours behind that.
#
# Both apps now use a GitHub App source instead — anonymous git from that host
# was being throttled by GitHub, which failed four sync deploys on 2 Sept — and
# a GitHub App *does* deliver push webhooks. So "Auto Deploy" is deliberately
# switched off on both applications in Coolify. Turning it back on would deploy
# every push twice, and would restart PocketBase under whoever is mid-sync on
# pushes that changed nothing it runs; the `what` job below exists precisely to
# avoid that.
#
# The talking-to-Coolify part lives in ai-os, not here. Those forty lines were
# written four times across this fleet and got three different things wrong in
# three different places — the response shape, the deployment states, and
# whether a queued build counts as a finished one. Pinned to a tag rather than
# @main so a change over there is a deliberate bump here, not a surprise that
# arrives mid-deploy.
#
# Secrets, named as the rest of the fleet names them:
#
#   COOLIFY_API_URL    the Coolify instance
#   COOLIFY_API_TOKEN  Keys & Tokens → API tokens, with deploy permission
#   COOLIFY_APP_UUID   the web resource's UUID — resolve it by NAME from
#                      GET /api/v1/applications, never from a stored value:
#                      one server hosts many apps and a stale UUID deploys to
#                      somebody else's production without complaining. The one
#                      already in env-config points at ai-os-landing.
#   COOLIFY_SYNC_UUID  the PocketBase resource's UUID — optional; unset means
#                      this workflow never touches the sync server
#
# Caveat worth knowing: if COOLIFY_API_URL is http:// rather than https://, the
# bearer token travels unencrypted from GitHub's runners.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sync_server:
        description: 'Also redeploy the sync server (PocketBase)'
        type: boolean
        default: false

permissions:
  contents: read

# One deploy at a time, and never cancel one in flight: Coolify is mid-build on
# the far side and a cancelled job would leave it there.
concurrency:
  group: coolify-deploy-main
  cancel-in-progress: false

jobs:
  what:
    name: Work out what needs deploying
    runs-on: ubuntu-latest
    outputs:
      sync: ${{ steps.decide.outputs.sync }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, because a rebase-merge lands several commits in
          # one push and the migration may be in the first of them, not the
          # last. Getting this wrong means the sync server silently misses one.
          fetch-depth: 0

      - name: Decide
        id: decide
        env:
          SYNC_UUID: ${{ secrets.COOLIFY_SYNC_UUID }}
          FORCE_SYNC: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_server }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Redeploying the sync server restarts PocketBase under whoever is
          # mid-sync, so it only goes when something it actually runs changed:
          # a migration, a hook, its Dockerfile or its compose file.
          sync=false
          if [ -z "$SYNC_UUID" ]; then
            echo "COOLIFY_SYNC_UUID is not set; the sync server is never deployed from here."
            echo "sync=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$FORCE_SYNC" = "true" ]; then
            echo "Sync server requested by hand."
            echo "sync=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Written as an `if`, not `a && b`: these steps run under `bash -e`,
          # where a trailing `&&` that short-circuits is a non-zero exit and
          # kills the step. A force push is exactly when that would fire.
          from=""
          case "$BEFORE" in
            ''|0000000000000000000000000000000000000000) ;;
            *)
              if git rev-parse --verify "$BEFORE^{commit}" >/dev/null 2>&1; then
                from="$BEFORE"
              fi
              ;;
          esac
          if [ -z "$from" ] && git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            from="HEAD~1"
          fi

          if [ -z "$from" ]; then
            # Nothing to compare against: deploying is the safe side of a guess
            # whose other side is a member hitting a collection that is not there.
            sync=true
            echo "No earlier commit to compare against; deploying the sync server too."
          elif git diff --name-only "$from" HEAD | grep -q '^deploy/pocketbase/'; then
            sync=true
            echo "deploy/pocketbase/ changed between $from and HEAD:"
            git diff --name-only "$from" HEAD | grep '^deploy/pocketbase/' | sed 's/^/  /'
          else
            echo "Nothing under deploy/pocketbase/ changed since $from; leaving the sync server alone."
          fi
          echo "sync=$sync" >> "$GITHUB_OUTPUT"

  web:
    uses: eddremonts86/ai-os/.github/workflows/reusable-coolify-deploy.yml@coolify-deploy-v1
    with:
      app: enforma
      # This repo wants to be told, not skipped. Its deploy is meant to work,
      # and a missing secret here is a green tick that deployed nothing —
      # exactly the failure this workflow exists to end.
      require_secrets: true
    secrets:
      coolify_api_url: ${{ secrets.COOLIFY_API_URL }}
      coolify_api_token: ${{ secrets.COOLIFY_API_TOKEN }}
      app_uuid: ${{ secrets.COOLIFY_APP_UUID }}

  sync:
    needs: what
    if: needs.what.outputs.sync == 'true'
    uses: eddremonts86/ai-os/.github/workflows/reusable-coolify-deploy.yml@coolify-deploy-v1
    with:
      app: enforma-pocketbase
    secrets:
      coolify_api_url: ${{ secrets.COOLIFY_API_URL }}
      coolify_api_token: ${{ secrets.COOLIFY_API_TOKEN }}
      app_uuid: ${{ secrets.COOLIFY_SYNC_UUID }}
