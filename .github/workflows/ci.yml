# The guardian. Nothing reaches `dev` or `main` without passing through here.
#
# Two jobs, and the second is the one that matters. Coolify does not run
# `pnpm build` on a Mac — it builds the Dockerfile, which runs
# `pnpm install --frozen-lockfile` inside a clean `node:26-alpine`. A lockfile
# that drifted, a dependency added without committing the lock, a native module
# the host tolerated and Alpine does not: none of those show up in a host build
# and every one of them fails the deploy. An afternoon of green local builds
# once proved nothing at all about the image that actually ships.
#
# The audit walks are the third and fourth jobs. They existed for a long time
# and nothing ran them, which is how five of them came to be failing at their
# first step — the landing grew a second sign-in panel and every selector at the
# door broke at once, silently, for weeks. A test nobody runs is a comment.
#
# Both jobs always run and always report. A job that is conditionally skipped
# cannot be a required status check — GitHub leaves the check pending forever
# and the branch never becomes mergeable — so the one conditional piece here
# (the sync-server image) is a step inside a job that always runs, not a job of
# its own.
name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

# Unlike the deploy, a superseded run is worth cancelling: nobody cares about
# the checks for a commit that has already been replaced.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Matches the Dockerfile. Node 25 stopped bundling corepack, which is
          # why pnpm is installed outright there and pinned here.
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      # The same flag the image build uses, so lockfile drift fails here in
      # thirty seconds instead of four minutes into a Docker build.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # `pnpm build` is `tsc -b && vite build`. The `-b` matters: this repo uses
      # project references, and `tsc --noEmit` at the root checks nothing at all
      # and exits 0 — which hid type errors here for a whole session.
      - name: Typecheck and build
        run: pnpm build

  # Collection rules, asked of a real PocketBase from the receiving side. No
  # browser and no app: a leak in a rule does not need the front end to be
  # involved, and this whole job is about ten seconds.
  audit-rules:
    name: Audit the rules
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Fetch PocketBase
        run: bash .github/scripts/fetch-pocketbase.sh

      - name: Walk the rules
        run: pnpm audit:rules

  # The app, in a real browser. Slow on purpose: two of these wait on actual
  # clocks, because a schedule tested against a mocked one proves the mock
  # works.
  audit-screens:
    name: Audit the screens
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Fetch PocketBase
        run: bash .github/scripts/fetch-pocketbase.sh

      # Chromium only: every walk launches `chromium` by name.
      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      # The built app rather than the dev server, so what is walked is what
      # ships. `--strictPort` because a preview that quietly moved would leave
      # every walk talking to nothing.
      - name: Build and serve
        run: |
          pnpm build
          pnpm exec vite preview --port 4173 --strictPort &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4173/ >/dev/null; then
              echo "serving on 4173"
              exit 0
            fi
            sleep 1
          done
          echo "::error title=No app::vite preview never answered on 4173."
          exit 1

      - name: Walk the screens
        env:
          BASE_URL: http://localhost:4173
        run: pnpm audit:screens

      # The contrast probe and the route sweep both leave pictures behind, and
      # a failure is far easier to read with them than without.
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-screens
          path: |
            docs/impeccable/shots/
            .audit-shots/
          if-no-files-found: ignore
          retention-days: 7

  images:
    name: Build the images Coolify ships
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          # Enough history to see what a pull request changed against its base.
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # amd64 is the runner's own architecture and the app inside is
          # JavaScript, so the arch it is assembled on does not change what
          # ships. The sync server below is a different story.
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Did the sync server change?
        id: sync
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Written as `if`, never `a && b`: these steps run under `bash -e`,
          # where a short-circuited `&&` is a non-zero exit that kills the step.
          from=""
          if [ -n "$BASE" ]; then
            git fetch --quiet origin "$BASE"
            from="origin/$BASE"
          else
            case "$BEFORE" in
              ''|0000000000000000000000000000000000000000) ;;
              *)
                if git rev-parse --verify "$BEFORE^{commit}" >/dev/null 2>&1; then
                  from="$BEFORE"
                fi
                ;;
            esac
            if [ -z "$from" ] && git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              from="HEAD~1"
            fi
          fi

          changed=false
          if [ -z "$from" ]; then
            changed=true
            echo "No base to compare against; building the sync image to be sure."
          elif git diff --name-only "$from" HEAD | grep -q '^deploy/pocketbase/'; then
            changed=true
            echo "deploy/pocketbase/ changed since $from:"
            git diff --name-only "$from" HEAD | grep '^deploy/pocketbase/' | sed 's/^/  /'
          else
            echo "Nothing under deploy/pocketbase/ changed since $from; skipping its image."
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      # Only when it changed, because it needs emulation and that is not free.
      - uses: docker/setup-qemu-action@v3
        if: steps.sync.outputs.changed == 'true'
        with:
          platforms: arm64

      - name: Build the sync-server image
        if: steps.sync.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: deploy/pocketbase
          push: false
          # arm64 on purpose. That Dockerfile downloads a PocketBase binary for
          # $TARGETARCH, the real box is arm64, and an amd64 binary only appears
          # to work locally because Docker Desktop emulates it. Building the
          # architecture that ships is the only way a bad version bump shows up
          # here rather than in production.
          platforms: linux/arm64
          cache-from: type=gha,scope=sync
          cache-to: type=gha,mode=max,scope=sync
